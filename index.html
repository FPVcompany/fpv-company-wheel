<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>FPV COMPANY — Wheel</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #292929, #090909 65%);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 28px 15px;
}

.logo {
    color: #e52323;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 5px;
}

h1 {
    font-size: 29px;
    margin: 12px 0 6px;
    font-weight: 900;
}

.subtitle {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 30px;
}

.wheel-wrap {
    position: relative;
    width: min(88vw, 370px);
    aspect-ratio: 1;
    margin: 0 auto 28px;
}

.pointer {
    position: absolute;
    z-index: 5;
    top: -13px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 17px solid transparent;
    border-right: 17px solid transparent;
    border-top: 38px solid #ed2525;
    filter: drop-shadow(0 3px 5px #000);
}

.wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 8px solid #d8d8d8;
    box-shadow: 0 0 0 5px #292929, 0 0 35px #e5232355;
    position: relative;
    overflow: hidden;
    transition: transform 6s cubic-bezier(.12,.72,.08,1);
    background: conic-gradient(
        #b51f25 0deg 30deg,
        #202020 30deg 60deg,
        #bd7b16 60deg 90deg,
        #171717 90deg 120deg,
        #b51f25 120deg 150deg,
        #202020 150deg 180deg,
        #bd7b16 180deg 210deg,
        #171717 210deg 240deg,
        #b51f25 240deg 270deg,
        #202020 270deg 300deg,
        #bd7b16 300deg 330deg,
        #d4a72c 330deg 360deg
    );
}

.wheel::after {
    content: "";
    position: absolute;
    width: 65px;
    height: 65px;
    background: radial-gradient(circle, #444, #090909);
    border: 4px solid #eee;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 15px #000;
}

.center-label {
    position: absolute;
    z-index: 2;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1px;
    color: white;
}

.spin {
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, #ed2929, #9e1010);
    color: white;
    padding: 17px 35px;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;
    box-shadow: 0 5px 20px #e5232355;
    cursor: pointer;
}

.spin:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.result {
    margin: 24px auto 0;
    padding: 17px;
    max-width: 340px;
    border: 1px solid #444;
    border-radius: 12px;
    background: #171717;
    color: #ddd;
    line-height: 1.6;
}

.gold {
    color: #f5c84c;
    text-shadow: 0 0 12px #e6a817;
}

.note {
    color: #777;
    font-size: 11px;
    margin-top: 25px;
}
</style>
</head>

<body>
<div class="logo">FPV COMPANY</div>
<h1>КОЛЕСО ФОРТУНИ</h1>
<div class="subtitle">Випробуй свою удачу та отримай бонуси!</div>

<div class="wheel-wrap">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>
    <div class="center-label">FPV<br>COMPANY</div>
</div>

<button class="spin" id="spin" disabled>
    🎡 КРУТИТИ КОЛЕСО
</button>

<div class="result" id="result">
    🎁 Призи від 1 до <span class="gold">100 грн</span><br>
    ⏳ Одне обертання кожні 7 днів
</div>

<div class="note">
    FPV COMPANY • BONUS WHEEL
</div>

<script>
const spinButton = document.getElementById("spin");
const wheel = document.getElementById("wheel");
const result = document.getElementById("result");

spinButton.addEventListener("click", () => {
    result.textContent =
        "Очікуємо підключення захищеного сервера...";
});
</script>
</body>
</html>
